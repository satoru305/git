<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>二万五千里 · 长征闯关问答</title>
<style>
  :root {
    --bg:#14100e; --panel:#241b16; --card:#2f241d; --line:#463528;
    --ink:#f2ece2; --dim:#ab9c8a; --red:#c8402f; --gold:#d8a34a;
    --ok:#5a9b52; --bad:#b3453a;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  .wrap { max-width:560px; margin:0 auto; padding:20px 18px 40px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:1px; }
  .sub { color:var(--dim); margin:0 0 22px; font-size:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .scene {
    position:relative; height:150px; border-radius:10px; overflow:hidden; margin-bottom:14px;
    background:linear-gradient(135deg,#5a3a20,#1b1512);
  }
  .scene img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.8; }
  .scene::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6)); }
  .scene .cap { position:absolute; left:12px; bottom:8px; z-index:1; font-weight:700; font-size:15px; text-shadow:0 1px 4px #000; }
  .material { background:var(--card); border-left:4px solid var(--gold); border-radius:8px; padding:12px 14px; margin-bottom:14px; color:#e7ddcc; }
  .ask { font-weight:700; margin:0 0 12px; }
  button {
    display:block; width:100%; text-align:left; margin:0 0 10px; padding:14px 16px;
    font:inherit; color:var(--ink); background:var(--card);
    border:1px solid #52402f; border-radius:12px; cursor:pointer;
  }
  button:active { transform:scale(.99); }
  button.right { border-color:var(--ok); background:#23321f; }
  button.wrong { border-color:var(--bad); background:#341f1c; }
  button.primary { background:var(--red); border-color:#a83526; text-align:center; font-weight:700; }
  button.ghost { background:transparent; text-align:center; color:var(--dim); border-color:#3a2c22; }
  button:disabled { opacity:.6; cursor:default; }
  .bar { height:8px; background:#3a2c22; border-radius:999px; overflow:hidden; margin:4px 0 14px; }
  .bar i { display:block; height:100%; background:var(--gold); width:0; transition:width .35s; }
  .head { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--dim); }
  .tag { display:inline-block; font-size:12px; color:var(--gold); border:1px solid #5b4426; border-radius:999px; padding:1px 9px; margin-right:6px; }
  .explain { background:#23321f; border-left:4px solid var(--ok); padding:11px 13px; border-radius:8px; font-size:14px; margin:4px 0 12px; }
  .explain.bad { background:#341f1c; border-color:var(--bad); }
  .warn { color:var(--gold); font-size:13px; }
  input[type=text] {
    width:100%; padding:13px 14px; font:inherit; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:12px;
  }
  .final { text-align:center; padding:22px 10px; }
  .final .score { font-size:44px; font-weight:800; color:var(--gold); line-height:1.2; }
  .hide { display:none; }
  .foot { color:#7c6e5e; font-size:12px; margin-top:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <div id="s-home">
    <h1>二万五千里</h1>
    <p class="sub">长征闯关问答 · 纪念红军长征胜利90周年</p>
    <div class="card">
      <p style="margin-top:0">十一道关卡，从贵州遵义一直走到甘肃会宁。每关一道单选题，按你答对的关卡计分；答错会给出解析，可以重答，但这一关不再计满分。</p>
    </div>
    <button class="primary" id="btnStart">开始长征</button>
    <button class="ghost hide" id="btnRestart">从头再来</button>
  </div>

  <div id="s-quiz" class="hide">
    <div class="head">
      <span id="nodeTag"></span>
      <span id="kmTag"></span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="card">
      <div class="scene"><img id="sceneImg" alt=""><span class="cap" id="sceneCap"></span></div>
      <div class="material" id="material"></div>
      <p class="ask" id="ask"></p>
      <div id="opts"></div>
      <div id="feedback"></div>
    </div>
  </div>

  <div id="s-final" class="hide">
    <h1>三大主力会师</h1>
    <p class="sub">1936年10月 · 甘肃会宁、静宁将台堡</p>
    <div class="scene"><img id="winImg" alt=""><span class="cap">红军长征胜利会师</span></div>
    <div class="card final">
      <div class="score"><span id="finalScore">0</span>/100</div>
      <p class="sub" id="finalNote"></p>
    </div>
    <div class="card">
      <p style="margin-top:0"><span class="tag">最后一题</span>你这一代人的长征是什么？写一句话，它会留在你的通关页上。</p>
      <input type="text" id="myWords" maxlength="60" placeholder="例如：把一门很难的课啃下来">
      <p id="wordsShow" class="warn hide"></p>
    </div>
    <button class="primary" id="btnAgain">再走一遍</button>
  </div>

  <p class="foot">思政实践作业 · 题库在 index.html 顶部 QUESTIONS 数组里修改</p>
</div>

<script>
/* ============================================================
   QUESTIONS：十一关题库（题目定稿）。一关一个对象：
   place 地名、time 时间、material 情境材料（可留空）、
   ask 提问、options 四个选项、answer 正确项下标（A=0 B=1 C=2 D=3）、explain 解析。
   正确项分布：A 2 次 / B 3 次 / C 3 次 / D 3 次。
   ============================================================ */
const QUESTIONS = [
  {
    place: "遵义", time: "1935年1月", material: "",
    ask: "1935年1月，中共中央在贵州遵义召开政治局扩大会议。这次会议集中全力解决的主要问题是（ ）",
    options: [
      "纠正博古等人在军事和组织上“左”的错误",
      "确定北上抗日的方针",
      "决定与红四方面军会师的地点",
      "选举朱德为中央政治局常委"
    ],
    answer: 0,
    explain: "遵义会议集中全力纠正了博古等人在军事和组织上“左”的错误，肯定了毛泽东的正确军事主张，并取消了博古、李德的军事最高指挥权。"
  },
  {
    place: "遵义", time: "1935年1月", material: "",
    ask: "遵义会议被视为中国共产党历史上一个生死攸关的转折点，主要是因为这次会议（ ）",
    options: [
      "开始确立以毛泽东为主要代表的正确路线在中共中央的领导地位",
      "宣告了长征的胜利结束",
      "决定放弃中央革命根据地",
      "实现了红军三大主力的会师"
    ],
    answer: 0,
    explain: "遵义会议开始确立以毛泽东为主要代表的马克思主义正确路线在中共中央的领导地位，在极其危急的情况下挽救了党、挽救了红军、挽救了中国革命，因此成为生死攸关的转折点。"
  },
  {
    place: "金沙江", time: "1935年5月", material: "",
    ask: "红军巧渡金沙江发生在下列哪一事件之后？（ ）",
    options: [
      "湘江战役",
      "四渡赤水",
      "飞夺泸定桥",
      "吴起镇会师"
    ],
    answer: 1,
    explain: "遵义会议后，红军四渡赤水，随后渡过金沙江，因此金沙江在四渡赤水之后、泸定桥和吴起镇之前。"
  },
  {
    place: "泸定桥", time: "1935年5月", material: "",
    ask: "飞夺泸定桥的重大意义在于（ ）",
    options: [
      "宣告长征胜利结束",
      "为红军北上打开了通道",
      "实现了国共合作抗日",
      "确立了毛泽东的领导地位"
    ],
    answer: 1,
    explain: "飞夺泸定桥使红军越过了大渡河天险，为继续北上打开了通道，避免了被围歼于大渡河以南的危险。"
  },
  {
    place: "雪山草地", time: "1935年6月起", material: "",
    ask: "中央红军开始翻越雪山、穿越草地的时间大约在（ ）",
    options: [
      "1936年10月",
      "1935年6月",
      "1934年10月",
      "1935年1月"
    ],
    answer: 1,
    explain: "红军是在1935年6月开始过雪山草地的，翻越夹金山等雪山、穿越茫茫草地，环境极为艰苦。"
  },
  {
    place: "雪山草地", time: "1935年6月起", material: "",
    ask: "红军在雪山草地中展现出的长征精神，核心内涵包括（ ）",
    options: [
      "固守阵地、寸土不让",
      "依靠外援、等待时机",
      "不怕牺牲、艰苦奋斗、革命乐观主义",
      "分散游击、保存实力"
    ],
    answer: 2,
    explain: "雪山草地见证了红军大无畏的革命英雄主义精神、不怕苦不怕累的进取精神和革命乐观主义精神，是长征精神的重要体现。"
  },
  {
    place: "雪山草地", time: "1935年6月起", material: "",
    ask: "过雪山草地这一艰难历程对长征全局产生的重要影响是（ ）",
    options: [
      "使红军彻底摆脱了国民党军队的追击",
      "直接促成了遵义会议的召开",
      "保存了革命骨干，磨砺了红军的意志",
      "标志着红军三大主力实现会师"
    ],
    answer: 2,
    explain: "雪山草地极端艰苦的环境磨砺了红军的意志，保存了党和红军的骨干力量，为后来走向胜利奠定了精神与组织基础；摆脱追兵主要是巧渡金沙江的意义，三大主力会师在会宁。"
  },
  {
    place: "吴起镇", time: "1935年10月", material: "",
    ask: "1935年10月，中央红军到达陕北吴起镇，与哪一部分红军胜利会师？（ ）",
    options: [
      "红二方面军",
      "红四方面军",
      "陕北红军",
      "红二十五军主力"
    ],
    answer: 2,
    explain: "1935年10月，中共中央带领中央红军到达陕甘革命根据地的吴起镇，与陕北红军胜利会师。"
  },
  {
    place: "吴起镇", time: "1935年10月", material: "",
    ask: "吴起镇会师的历史意义是（ ）",
    options: [
      "宣告红军三大主力长征全部结束",
      "标志着抗日战争的全面爆发",
      "确立了毛泽东在党内的领导地位",
      "标志着红一方面军主力胜利完成长征"
    ],
    answer: 3,
    explain: "吴起镇会师标志着红一方面军主力胜利完成历时一年、纵横十几个省的长征，实现了战略大转移；三大主力长征结束的标志是会宁会师。"
  },
  {
    place: "会宁", time: "1936年10月", material: "",
    ask: "1936年10月，红军三大主力在甘肃会宁地区会师。参加会师的主力部队是（ ）",
    options: [
      "红一、红三、红五方面军",
      "红二、红六、红七方面军",
      "红四、红五、红八方面军",
      "红一、红二、红四方面军"
    ],
    answer: 3,
    explain: "1936年10月，红二方面军和红四方面军到达甘肃会宁地区，与红一方面军胜利会师，红军三大主力会合，宣告长征胜利结束。"
  },
  {
    place: "会宁", time: "1936年10月", material: "",
    ask: "会宁会师最重要的历史影响是（ ）",
    options: [
      "标志着中国共产党开始独立领导武装斗争",
      "实现了国共两党的第二次合作",
      "宣告了北洋军阀统治的覆灭",
      "使中国革命转危为安，打开了中国革命的新局面"
    ],
    answer: 3,
    explain: "长征胜利粉碎了国民党反动派消灭红军的企图，保存了党和红军的基干力量，使中国革命转危为安，并打开了中国革命的新局面。"
  }
];

/* 下面都是引擎逻辑，改题目不用动。 */

/* 每关背景照片：文件名写在 SCENES 数组里，第 n 关用第 n 个（顺序对应关卡，不用改代码就能换图）。
   图片放在 E:\git\img\，网页上访问路径是 img/xxx。某一张没放或名字写错时，只会退回渐变色底，不会出现破图。 */
const SCENES = [
  "img/01.png", // 遵义会议会址
  "img/02.jpg", // 遵义会议
  "img/03.webp", // 巧渡金沙江
  "img/04.png", // 泸定桥铁索
  "img/05.png", // 夹金山
  "img/06.jpg", // 过雪山
  "img/07.png", // 水草地
  "img/08.png", // 长征到达陕北后的毛泽东
  "img/09.webp", // 会师
  "img/10.png", // 红一、二、四方面军与红十五军团团以上干部合影
  "img/10.png"  // 会宁会师（同上，11.jpg 带微博水印暂不使用）
];
const WIN_IMG = "img/10.png";

const TOTAL_KM = 25000;
const KEY = "cz-quiz-v2";
const $ = (id) => document.getElementById(id);
let st = { i: 0, hits: 0, done: false, missed: {} };

/* 音效：用振荡器合成，不用音频文件。浏览器要求先有点击才允许出声，所以在答题时才建音频上下文。 */
let ac = null;
function ensureAudio() {
  if (!ac) {
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; }
  }
  if (ac && ac.state === "suspended") {
    try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
}
function tone(freq, delay, dur, type, peak) {
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine";
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.03);
}
function sndRight() {
  ensureAudio();
  if (!ac) return;
  tone(659, 0, 0.13);
  tone(988, 0.12, 0.24);
}
function sndWrong() {
  ensureAudio();
  if (!ac) return;
  tone(233, 0, 0.16, "sawtooth", 0.07);
  tone(175, 0.14, 0.26, "sawtooth", 0.07);
}
function setScene(img, src, cap) {
  img.style.display = "";
  img.onerror = function () { this.style.display = "none"; };
  img.src = src;
  if (cap !== undefined) img.parentNode.querySelector(".cap").textContent = cap;
}

function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
}
function show(name) {
  ["s-home", "s-quiz", "s-final"].forEach((id) => $(id).classList.toggle("hide", id !== name));
}
function renderHome() {
  show("s-home");
  const started = st.i > 0 || st.done;
  $("btnStart").textContent = st.done ? "看看你的通关页" : started ? "继续长征" : "开始长征";
  $("btnRestart").classList.toggle("hide", !started);
}
function renderQuiz() {
  const n = st.i, q = QUESTIONS[n];
  show("s-quiz");
  $("nodeTag").innerHTML = '<span class="tag">第 ' + (n + 1) + " 关</span>" + q.place + " · " + q.time;
  const km = Math.round(TOTAL_KM * n / QUESTIONS.length);
  $("kmTag").textContent = "行程 " + km + " 里";
  $("barFill").style.width = (100 * n / QUESTIONS.length) + "%";
  const mat = $("material");
  mat.textContent = q.material;
  mat.classList.toggle("hide", !q.material);
  $("ask").textContent = q.ask;
  setScene($("sceneImg"), SCENES[n] || "", q.place);
  $("feedback").innerHTML = "";
  const box = $("opts");
  box.innerHTML = "";
  q.options.forEach((text, idx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = "ABCD".charAt(idx) + ". " + text;
    b.onclick = () => pick(idx, b);
    box.appendChild(b);
  });
}
function pick(idx, btn) {
  const q = QUESTIONS[st.i];
  const firstTry = !st.missed[st.i];
  if (idx === q.answer) {
    btn.classList.add("right");
    sndRight();
    if (firstTry) st.hits += 1;
    lock(q, false);
  } else {
    btn.classList.add("wrong");
    btn.disabled = true;
    sndWrong();
    st.missed[st.i] = true;
    $("feedback").innerHTML = '<div class="explain bad">' + q.explain + "</div>";
    return;
  }
  save();
}
function lock(q, wrong) {
  Array.prototype.forEach.call($("opts").children, (b) => { b.disabled = true; });
  $("feedback").innerHTML = '<div class="explain">' + q.explain + "</div>";
  const next = document.createElement("button");
  next.className = "primary";
  next.textContent = st.i + 1 >= QUESTIONS.length ? "三大主力会师" : "继续行军";
  next.onclick = () => {
    st.i += 1;
    if (st.i >= QUESTIONS.length) { st.done = true; }
    save();
    st.done ? renderFinal() : renderQuiz();
  };
  $("feedback").appendChild(next);
}
function renderFinal() {
  show("s-final");
  setScene($("winImg"), WIN_IMG);
  $("barFill").style.width = "100%";
  $("finalScore").textContent = Math.round(100 * st.hits / QUESTIONS.length);
  const missCount = Object.keys(st.missed).length;
  $("finalNote").textContent = missCount
    ? "有 " + missCount + " 关是重答后才走对的。"
    : QUESTIONS.length + " 关全部一次走对。";
  const words = $("myWords");
  words.oninput = () => {
    const p = $("wordsShow");
    p.classList.toggle("hide", !words.value.trim());
    p.textContent = "“" + words.value.trim() + "”";
  };
}
function reset() {
  st = { i: 0, hits: 0, done: false, missed: {} };
  save();
  renderHome();
}
$("btnStart").onclick = () => { st.done ? renderFinal() : renderQuiz(); };
$("btnRestart").onclick = reset;
$("btnAgain").onclick = reset;
load();
renderHome();
</script>
</body>
</html>
